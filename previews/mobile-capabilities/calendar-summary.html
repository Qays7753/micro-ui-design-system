<link rel="stylesheet" href="../../components/order-schedule/order-schedule.css"><link rel="stylesheet" href="../compositions/compositions.css"></head><body><main class="example-page"><header class="example-header"><a href="index.html">قدرات الهاتف المشتركة</a><h1>ملخص التقويم الخارجي</h1><p>العنوان يفرّق بين اليوم المحدد والشهر المعروض. الملخص خارج جذر التقويم.</p><p class="example-caption">عينات مستقلة للهاتف، لا حفظ أو شبكة أو تنفيذ في تطبيق.</p></header><div id="summary-consumer"><section class="demo-section"><div class="m-field"><label class="m-field__label" for="summary-scope">نطاق الملخص</label><div class="m-field__control"><select class="m-field__input" id="summary-scope"><option value="day">اليوم المحدد</option><option value="month">الشهر المعروض</option></select></div></div>
<article class="m-info-card m-info-card--compact m-info-card--context" id="calendar-context" role="status" aria-atomic="true"><span class="m-info-card__label" data-context-title></span><bdi class="m-info-card__context" dir="ltr" data-context-period></bdi><span class="m-info-card__reading"><bdi class="m-info-card__number" dir="auto" data-context-value></bdi><span class="m-info-card__unit" data-context-unit>طلب</span></span><p class="m-info-card__note" data-context-note></p></article></section><section class="demo-section"><h2>التقويم</h2><div id="summary-calendar"></div></section>
<details class="demo-tools"><summary>أدوات مستهلك العينة</summary><div class="demo-actions"><button type="button" class="m-btn m-btn--secondary" id="set-summary-date">تعيين تاريخ برمجيًا</button><button type="button" class="m-btn m-btn--secondary" id="destroy-summary">تنظيف العينة</button></div><div class="m-field"><label class="m-field__label" for="summary-state">حالة بيانات الملخص</label><div class="m-field__control"><select class="m-field__input" id="summary-state"><option value="ready">قراءات معلومة</option><option value="loading">انتظار</option><option value="error">خطأ</option><option value="empty">مصدر فارغ معلوم</option></select></div></div></details></div><p id="summary-end" hidden>نُظفت العينة؛ أعد تحميل الصفحة لتجربتها من جديد.</p></main><script src="../../components/order-schedule/order-schedule.js"></script><script src="calendar-summary.js"></script></body></html>
