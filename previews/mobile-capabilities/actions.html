<link rel="stylesheet" href="../compositions/compositions.css"></head><body><main class="example-page"><header class="example-header"><a href="index.html">قدرات الهاتف المشتركة</a><h1>قائمة إجراءات للهاتف</h1><p>القائمة نفسها تُستدعى من سياقين، وترفع الطلب بعد اكتمال إغلاقها.</p><p class="example-caption">عينات مستقلة للهاتف، لا حفظ أو شبكة أو تنفيذ في تطبيق.</p></header><section class="demo-section"><h2>سياق الصف</h2><div class="m-row"><span class="m-row__text"><span class="m-row__title">عنصر عينة مستقل</span></span><button type="button" class="m-btn m-btn--secondary" data-example-actions="row-example" id="row-actions">المزيد</button></div></section>
<section class="demo-section"><h2>سياق البطاقة</h2><article class="m-info-card m-info-card--compact m-info-card--context"><span class="m-info-card__label">قراءة عينة</span><span class="m-info-card__reading"><bdi class="m-info-card__number" dir="ltr">149</bdi><span class="m-info-card__unit">قطعة</span></span><button type="button" class="m-btn m-btn--secondary" data-example-actions="card-example" id="card-actions">إجراءات البطاقة</button></article></section>
<p id="action-feedback" role="status" class="example-feedback"></p><details class="demo-tools"><summary>حالة المعاينة</summary><button type="button" class="m-btn m-btn--secondary" id="toggle-empty-actions">تبديل القائمة الفارغة</button></details></main>
<div class="m-layer-backdrop" id="actions-backdrop" data-for="sample-actions" hidden></div>
<div class="m-layer m-action-sheet" id="sample-actions" data-backdrop-id="actions-backdrop" role="dialog" aria-modal="true" aria-labelledby="actions-title" hidden>

<div class="m-layer__body"><p data-actions-empty hidden>لا إجراءات متاحة لهذا السياق.</p><ul class="m-action-sheet__list"><li><button type="button" class="m-btn m-btn--secondary m-action-sheet__item" data-action-id="inspect">عرض التفاصيل</button></li><li><button type="button" class="m-btn m-btn--secondary m-action-sheet__item" data-action-id="copy">نسخ المرجع</button></li><li><button type="button" class="m-btn m-btn--secondary m-action-sheet__item" data-action-id="unavailable" disabled>إجراء غير متاح</button></li><li><button type="button" class="m-btn m-btn--destructive-soft m-action-sheet__item" data-action-id="delete">حذف</button></li></ul></div></div><script src="../../components/navigation/navigation.js"></script><script src="../../components/navigation/action-sheet.js"></script><script src="actions.js"></script></body></html>
