<!doctype html><html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>حدود التركيب — مالك واحد للطبقة</title><link rel="stylesheet" href="boundaries.css"></head><body data-fixture="layers"><main class="fixture-shell"><a href="index.html">حاضنات التركيب</a><h1>مالك واحد للطبقة</h1><p>قارن حاوية تقصّ fixed مع تركيب خارجها. Navigation للعرض غير المحمي؛ الحوار الأصلي له قرار إغلاق محلي.</p><div class="fixture-actions"><button class="fixture-action" id="bad-layer">فتح داخل حاوية مقصوصة</button><button class="fixture-action" id="portal-layer">فتح بعد النقل خارج الحاوية</button><button class="fixture-action" id="native-open">فتح حوار أصلي مستقل</button></div><p id="layer-status" role="status">D01 غير منفذ. لا History في الحاضنة.</p><div class="fixture-trap" id="trap"><p>transform + contain:paint + overflow:hidden</p><div class="m-layer-backdrop" id="shade-outer" data-for="outer" hidden></div><div class="m-layer" id="outer" aria-labelledby="outer-title" hidden><header class="m-layer__head"><h2 class="m-layer__title" id="outer-title">قراءة داخل الطبقة</h2><button class="m-btn m-btn--secondary" data-close-layer="outer">إغلاق</button></header><div class="m-layer__body fixture-layer-body"><div id="layer-value"></div><div class="fixture-actions"><button class="m-btn m-btn--secondary" id="nested-open">طبقة ثانية</button><button class="m-btn m-btn--secondary" id="append-background">إضافة خلفية جديدة</button><button class="m-btn m-btn--secondary" id="try-native">محاولة محرك ثانٍ</button><button class="m-btn m-btn--secondary" id="dispose-layer">تنظيف الطبقة</button></div><p>لا حفظ أو تعديل في هذه الطبقة.</p></div></div></div></main><script src="../../components/buttons/buttons.js"></script><script src="../../components/fields/fields.js"></script><script src="../../components/navigation/navigation.js"></script><script src="boundaries.js"></script></body></html>
