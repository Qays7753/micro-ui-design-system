<!DOCTYPE html>
<!-- =========================================================
  Micro UI — مثال استخدام مستقل لحقول B02 — SYS-02/E11
  بلا board.css/board.js — مصادر المكوّن + تركيب أزرار B01 موثق.
  فحوص مدمجة: IDs رسائل فريدة لحقلين متطابقين، دمج وصف سابق،
  مسح readonly محمي، عدّاد، خطوة بحدود، ومزامنة القيم المعينة
  برمجيًا عبر MicroFields.sync (عدّاد/مسح بلا أحداث تعديل).
  SUI-006 (REPAIR-R1): زرا الخطوة زرا B01 حقيقيان بعقد المواصفة §2
  (m-btn--icon m-btn--secondary بهدف لمس 48px + aria-label عربي)
  مع مثال خطوة عامل (u-4) ومثال محمي (u-3 قراءة فقط) — الأزرار
  الخام بمقاسات مخصصة خارج هذا العقد (محظورة نصًا في المواصفة).
  النتائج في الصفحة.
========================================================= -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micro — مثال مستقل: الحقول (B02)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="../../components/fields/fields.css">
  <link rel="stylesheet" href="../../components/buttons/buttons.css">
  <style>body{font-family:var(--micro-font-family);margin:16px;max-width:420px}pre{background:#fff;border:1px solid #D9E1DE;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
  <h1 style="font-size:18px">مثال مستقل — الحقول (B02)</h1>
  <div class="m-field" data-micro-field>
    <label class="m-field__label" for="u-1">اسم المستفيد</label>
    <div class="m-field__control">
      <input class="m-field__input" id="u-1" type="text" value="أحمد" maxlength="40">
      <button type="button" class="m-btn m-btn--icon m-btn--secondary m-field__clear" aria-label="مسح"><svg class="m-btn__icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <p class="m-field__msg" data-field-msg hidden>رسالة أ</p>
    <span class="m-field__count" aria-hidden="true"></span>
  </div>
  <div class="m-field" data-micro-field>
    <label class="m-field__label" for="u-2">حقل متطابق البنية (بلا id للغلاف)</label>
    <div class="m-field__control"><input class="m-field__input" id="u-2" type="text" aria-describedby="prior-help"></div>
    <p class="m-field__msg" data-field-msg hidden>رسالة ب</p>
  </div>
  <p id="prior-help" hidden>وصف مساعدة سابق</p>
  <div class="m-field" data-micro-field>
    <label class="m-field__label" for="u-3">كمية قراءة فقط</label>
    <div class="m-field__control">
      <div class="m-field__stepper">
        <button type="button" class="m-btn m-btn--icon m-btn--secondary" data-step="down" aria-label="إنقاص الكمية"><svg class="m-btn__icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
      </div>
      <input class="m-field__input m-field__input--num" id="u-3" type="text" inputmode="decimal" dir="ltr" value="10" min="0" max="99" step="5" readonly>
      <div class="m-field__stepper">
        <button type="button" class="m-btn m-btn--icon m-btn--secondary" data-step="up" aria-label="زيادة الكمية"><svg class="m-btn__icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
      </div>
    </div>
  </div>
  <div class="m-field" data-micro-field>
    <label class="m-field__label" for="u-4">كمية قابلة للتعديل (خطوة عاملة)</label>
    <div class="m-field__control">
      <div class="m-field__stepper">
        <button type="button" class="m-btn m-btn--icon m-btn--secondary" data-step="down" aria-label="إنقاص الكمية"><svg class="m-btn__icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
      </div>
      <input class="m-field__input m-field__input--num" id="u-4" type="text" inputmode="decimal" dir="ltr" value="10" min="0" max="99" step="5">
      <div class="m-field__stepper">
        <button type="button" class="m-btn m-btn--icon m-btn--secondary" data-step="up" aria-label="زيادة الكمية"><svg class="m-btn__icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
      </div>
      <span class="m-field__unit">صندوق</span>
    </div>
  </div>
  <pre id="results">جارٍ الفحص…</pre>

  <!-- أيقونات هذا المثال تُجلب من الأصول نفسها (assets/icons) وقت التشغيل —
       هذا دور المستهلك (الصفحة) وليس دور المكوّن (نمط مثال B01 نفسه). -->
  <svg xmlns="http://www.w3.org/2000/svg" id="usage-icon-defs" style="display:none" aria-hidden="true"></svg>
  <script>
    (function () {
      var defs = document.getElementById('usage-icon-defs');
      ['minus-sign.svg|i-minus', 'plus-sign.svg|i-plus', 'cancel01.svg|i-close']
        .forEach(function (entry) {
          var parts = entry.split('|');
          fetch('../../assets/icons/' + parts[0])
            .then(function (r) { return r.text(); })
            .then(function (text) {
              var doc = new DOMParser().parseFromString(text, 'image/svg+xml');
              var src = doc.querySelector('svg');
              if (!src || doc.querySelector('parsererror')) return;
              var sym = document.createElementNS('http://www.w3.org/2000/svg', 'symbol');
              sym.id = parts[1];
              sym.setAttribute('viewBox', src.getAttribute('viewBox') || '0 0 24 24');
              sym.setAttribute('fill', src.getAttribute('fill') || 'none');
              sym.innerHTML = src.innerHTML;
              defs.appendChild(sym);
            });
        });
    })();
  </script>
  <script src="../../components/fields/fields.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    (function () {
      'use strict';
      var out = [];
      function t(n, ok, d) { out.push((ok ? 'PASS ' : 'FAIL ') + n + (d ? ' — ' + d : '')); }
      var fields = [...document.querySelectorAll('[data-micro-field]')];
      var id1 = fields[0].querySelector('[data-field-msg]').id;
      var id2 = fields[1].querySelector('[data-field-msg]').id;
      t('معرفا رسالة فريدان لحقلين متطابقين', id1 && id2 && id1 !== id2, id1 + ' / ' + id2);
      var desc = document.getElementById('u-2').getAttribute('aria-describedby').split(/\s+/);
      t('دمج وصف سابق دون استبدال', desc.indexOf('prior-help') >= 0 && desc.indexOf(id2) >= 0, desc.join(' '));
      var ro = document.getElementById('u-3');
      fields[2].querySelector('[data-step="up"]').click();
      t('خطوة على readonly محمية (القيمة كما هي)', ro.value === '10', ro.value);
      /* SUI-006: الخطوة تعمل فعليًا على الحقل القابل للتعديل (u-4) بالحدود والخطوة */
      var q4 = document.getElementById('u-4');
      var f4 = q4.closest('.m-field');
      f4.querySelector('[data-step="up"]').click();
      var upV = q4.value;
      f4.querySelector('[data-step="down"]').click();
      f4.querySelector('[data-step="down"]').click();
      var downV = q4.value;
      t('خطوة الكمية تعمل فعليًا (10 → 15 → 5) بحدود المستهلك', upV === '15' && downV === '5', upV + ' → ' + downV);
      var steps = [].slice.call(document.querySelectorAll('[data-step]'));
      var sizesOk = steps.every(function (b) {
        var r = b.getBoundingClientRect();
        return r.width >= 47.5 && r.height >= 47.5;
      });
      t('كل زر خطوة بعقد B01 (هدف لمس 48×48)', sizesOk && steps.length === 4, steps.length + ' أزرار');
      var inp = document.getElementById('u-1');
      inp.value = 'أحمد سالم';
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      var cnt = document.querySelector('.m-field__count').textContent;
      t('العدّاد يتبع القيمة (حد معلن)', cnt === '9/40', cnt);
      inp.closest('.m-field__control').querySelector('.m-field__clear').click();
      t('المسح يفرّغ القيمة ويعيد التركيز', inp.value === '' && document.activeElement === inp);
      /* UI-05/UI-06: مزامنة القيم المعينة برمجيًا (لا حدث input مع input.value) */
      var evCount = 0;
      inp.addEventListener('input', function () { evCount++; });
      inp.value = 'عنصر تجريبي'; /* تعيين برمجي بلا dispatchEvent */
      var staleCnt = document.querySelector('.m-field__count').textContent;
      var staleClear = fields[0].querySelector('.m-field__clear').classList.contains('is-visible');
      t('قبل المزامنة: العدّاد متقادم 0/40 والمسح مخفي بعد تعيين برمجي', staleCnt === '0/40' && !staleClear, staleCnt + ' / clear=' + staleClear);
      MicroFields.sync(fields[0]);
      var syncCnt = document.querySelector('.m-field__count').textContent;
      var syncClear = fields[0].querySelector('.m-field__clear').classList.contains('is-visible');
      t('MicroFields.sync(field) يحدّث العدّاد 11/40 ويظهر المسح', syncCnt === '11/40' && syncClear, syncCnt + ' / clear=' + syncClear);
      t('المزامنة لا تطلق أي حدث input', evCount === 0, 'أحداث input=' + evCount);
      inp.readOnly = true;
      MicroFields.sync(fields[0]);
      var roClear = fields[0].querySelector('.m-field__clear').classList.contains('is-visible');
      t('المزامنة تحترم readonly: المسح يختفي والقيمة تبقى', !roClear && inp.value === 'عنصر تجريبي');
      inp.readOnly = false;
      document.getElementById('results').textContent = out.join('\n');
      console.log('[example] نتائج فحص الحقول:\n' + out.join('\n'));
    })();
  });
  </script>
</body>
</html>
