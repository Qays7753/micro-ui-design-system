  <!-- فهرس مثال vanilla-app: تطبيق صغير مستقل يستهلك المصدر من مرآة src/

    main { max-width: 430px; margin-inline: auto; padding: var(--micro-space-4); display: grid; gap: var(--micro-space-4); }
