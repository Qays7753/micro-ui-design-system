/* Micro UI foundations — three intentional layers:
   1. brand/data primitives; 2. adaptive semantic roles; 3. component aliases.
   CSS is the runtime source of truth. The host owns data-theme and persistence. */
:root,
[data-theme="light"] {
  color-scheme: light;
  --micro-color-brand-primary: #164D59;
  --micro-color-brand-pressed: #103E48;
  --micro-color-brand-gradient: #236675;
  --micro-color-brand-support: #507F8B;
  --micro-color-brand-accent: #D97757;
  --micro-color-white: #FFFFFF;
  --micro-color-ink: #172D32;
  --micro-color-ink-soft: #50656A;
  --micro-color-canvas: #F7F8F4;
  --micro-color-surface: #FFFFFF;
  --micro-color-raised: #FFFFFF;
  --micro-color-selected: #DFEEE6;
  --micro-color-disabled: #E4EAE8;
  --micro-color-border: #71868B;
  --micro-color-divider: #DCE5E2;
  --micro-color-focus: #164D59;
  --micro-color-danger: #AD303B;
  --micro-color-success: #176647;
  --micro-color-warning: #815400;
  --micro-color-info: #265E91;

  /* Semantic roles */
  --ui-canvas: var(--micro-color-canvas);
  --ui-surface: var(--micro-color-surface);
  --ui-surface-raised: var(--micro-color-raised);
  --ui-surface-selected: var(--micro-color-selected);
  --ui-surface-disabled: var(--micro-color-disabled);
  --ui-text: var(--micro-color-ink);
  --ui-text-secondary: var(--micro-color-ink-soft);
  --ui-text-muted: #5F7378; /* مشتقة مباشرة (R-62): رمادية حبر مخففة — أغمق من ink-soft بدرجة قراءة ثانوية */
  --ui-text-inverse: var(--micro-color-white);
  --ui-border-control: var(--micro-color-border);
  --ui-border-divider: var(--micro-color-divider);
  --ui-focus: var(--micro-color-focus);
  --ui-action: var(--micro-color-brand-primary);
  --ui-action-ink: var(--micro-color-brand-primary);
  --ui-action-outline: transparent;
  --ui-action-pressed: var(--micro-color-brand-pressed);
  --ui-danger: var(--micro-color-danger);
  --ui-success: var(--micro-color-success);
  --ui-warning: var(--micro-color-warning);
  --ui-info: var(--micro-color-info);
  --ui-overlay-shadow: 0 12px 32px rgb(23 45 50 / 16%);

  /* Component aliases retained for current source consumers */
  --micro-brand-primary: var(--ui-action);
  --micro-brand-ink: var(--ui-action-ink);
  --micro-action-outline: var(--ui-action-outline);
  --micro-brand-pressed: var(--ui-action-pressed);
  --micro-brand-gradient-start: var(--micro-color-brand-gradient);
  --micro-brand-support: var(--micro-color-brand-support);
  --micro-brand-accent: var(--micro-color-brand-accent);
  --micro-surface-page: var(--ui-canvas);
  --micro-surface-base: var(--ui-surface);
  --micro-surface-selected: var(--ui-surface-selected);
  --micro-surface-disabled: var(--ui-surface-disabled);
  --micro-surface-light: 0.12;
  --micro-summary-gradient-start: #B8D9DC;
  --micro-summary-light-start: #B8D9DC;
  --micro-summary-light-mid: #DFEEE6; /* (R-62) تتطابق قيمةً مع surface-selected وتظل دورًا مستقلًا لتدرج الملخص */
  --micro-summary-light-end: #F7F8F4;
  --micro-text-primary: var(--ui-text);
  --micro-text-secondary: var(--ui-text-secondary);
  --micro-text-hint: var(--ui-text-muted);
  --micro-text-inverse: var(--ui-text-inverse);
  --micro-text-disabled: #53676B; /* مشتقة مباشرة (R-62): قريب ink-soft بتقديم disabled */
  --micro-border-control: var(--ui-border-control);
  --micro-border-divider: var(--ui-border-divider);
  --micro-focus-ring: var(--ui-focus);
  --micro-focus-ring-width: 2px;
  --micro-focus-gap: 2px;
  --micro-data-boundary: var(--micro-text-secondary);
  --micro-data-line: var(--micro-brand-ink);

  /* Meaning and data remain distinct from brand, even where a value matches. */
  --micro-success: var(--ui-success);
  --micro-success-surface: #E5F3EA;
  --micro-danger: var(--ui-danger);
  --micro-danger-action: var(--micro-color-danger);
  --micro-danger-surface: #FBEAEC;
  --micro-danger-pressed: #8F2730;
  --micro-warning: var(--ui-warning);
  --micro-warning-surface: #FFF1CD;
  --micro-info: var(--ui-info);
  --micro-info-surface: #E9F1FA;
  --micro-data-a: #164D59;
  --micro-data-b: #D97757;
  /* R-06 (2026-10-25): تعتيم داخل الصبغة لسلسلتي c/e لبلوغ أرضية
     WCAG 1.4.11 (3:1) فوق الأبيض: c #B6A3D6→#A189CA (2.28→3.02:1)،
     e #B3BD7B→#8E9A4D (2.00→3.05:1). القيم المرجعية محفوظة هنا
     للتوثيق؛ التمييز بين السلاسل المتجاورة يسنده حد --micro-data-boundary
     + نص القراءات الكامل، لا فرق الإضاءة وحده (خمس سلاسل متجاورة
     لا يمكن أن تبعد كلها 3:1 إضاءةً ضمن نطاق إضاءة صالح). */
  --micro-data-c: #A189CA;
  --micro-data-d: #496D92;
  --micro-data-e: #8E9A4D;

  /* Geometry B — compact content, never compact touch targets. */
  --micro-space-1: 4px;
  --micro-space-2: 8px;
  --micro-space-3: 12px;
  --micro-space-4: 16px;
  --micro-space-5: 20px;
  --micro-space-6: 24px;
  --micro-space-8: 32px;
  --micro-space-10: 40px;
  --micro-touch-min: 48px;
  --micro-button-min-height: 48px;
  --micro-button-padding-inline: 16px;
  --micro-button-padding-block: 10px;
  --micro-button-gap: 8px;
  --micro-icon-in-button: 20px;
  --micro-icon-button-size: 48px;
  --micro-icon-button-icon: 24px;
  --micro-counter-height: 20px;
  --micro-counter-label-size: 13px;
  --micro-counter-label-weight: 500;
  /* R-10 (2026-10-25): توكنز أوزان الخط — الأوزان المشحونة فقط
     (400/500/600)؛ لا 700 ولا 800 (لا faux-bold). */
  --micro-weight-regular: 400;
  --micro-weight-medium: 500;
  --micro-weight-semibold: 600;

  /* R-11 (2026-10-25): مستوى عنوان القسم 18px بسطر نسبي (لا ارتفاع
     مقفول يقص عند تكبير النص وحده) — كان مستوى خامًا خارج المصدر */
  --micro-section-title-size: 18px;
  --micro-section-title-line: 1.5556;

  /* R-12 (2026-10-25): سلم الطبقات z الموثق — غشاء الطبقة < الطبقة
     نفسها < toast. أي قيمة أعلى تُقرر صراحةً من المضيف خارج المكتبة. */
  --micro-z-backdrop: 80;
  --micro-z-layer: 85;
  --micro-z-toast: 90;

  --micro-radius-capsule: 999px;
  --micro-radius-button-long: 12px;
  --micro-radius-field: 12px;
  --micro-radius-surface: 16px;
  --micro-radius-overlay: 20px;
  --micro-radius-hero: 24px;
  --micro-radius-chip: 8px;
  --micro-radius-choice: 8px;
  --micro-radius-circle: 50%;

  /* IBM Plex: Latin/numerals and Arabic fallbacks remain authoritative. */
  --micro-font-family: 'IBM Plex Sans', 'IBM Plex Sans Arabic', sans-serif;
  --micro-body-size: 16px;
  --micro-body-line: 1.625;
  --micro-label-size: 14px;
  --micro-label-line: 1.571;
  --micro-secondary-size: 13px;
  --micro-secondary-line: 1.538;

}

/* عقد المرجع الأعلى 3: تلاشٍ 200ms لتغيّر الشهر فقط (بلا انزلاق) —
   وتُلغى الحركة كاملة تحت prefers-reduced-motion أسفل الملف. */
.m-ocal[data-ocal-fade="1"] .m-ocal__calcard {
  animation: m-ocal-month-fade 200ms var(--micro-ease-standard);
}

@keyframes m-ocal-month-fade {
  from { opacity: 0.35; }
  to { opacity: 1; }
}

.m-ocal__weekdays {
  display: flex;
  background-color: var(--micro-surface-base);
}
.m-ocal__weekday {
  width: calc(100% / 7);
  min-width: 0;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: var(--micro-label-size);
  font-weight: var(--micro-weight-medium);
  line-height: var(--micro-label-line);
  color: var(--micro-text-secondary);
  /* إصلاح R3-2b (2026-10-08): الالتفاف في أي مكان — اسم يوم عربي كلمة
     واحدة لا يتسع في عمود ~37px عند نص×2؛ المكوّن مكتفٍ ذاتيًا ولا
     يعتمد على وراثة overflow-wrap من صفحة المستهلك */
  overflow-wrap: anywhere;
}

.m-ocal__grid {
  display: flex;
  flex-direction: column;
  /* Owner B (2026-11-11): subtle internal day-grid dividers only. */
  gap: 0;
}

.m-ocal__gridrow {
  display: flex;
  position: relative;
  /* عقد المرجع الأعلى 2.4: أرضية ارتفاع الصف ثابتة 48px (هدف اللمس)
     — التشريح الثابت (chip 28 + فجوة 4 + خانة 6) يجلس متمركزًا
     داخلها فتتقاسم الأسس صفًا كاملًا سواء وُجدت أحداث أم لا.
     عند تكبير النص تنمو الأرضية مع المحتوى (min-height) فلا قصّ. */
  font-size: var(--micro-label-size);
  min-height: var(--micro-touch-min);
}

.m-ocal__gridrow:not(:last-child)::after {
  content: "";
  position: absolute;
  inset-inline: 0;
  inset-block-end: 0;
  height: 1px;
  background-color: color-mix(in srgb, var(--micro-border-divider) 60%, transparent);
  pointer-events: none;
}
.m-ocal__gridrow > .m-ocal__cell + .m-ocal__cell {
  border-inline-start: 1px solid color-mix(in srgb, var(--micro-border-divider) 60%, transparent);
}

/* ---- العرض المدمج للشبكة الكاملة (جذر < 360px؛ data-ocal-compact) ----
   نفس بنية الشبكة والتشريح نفسه: عرض الخلية (100%−24px)/7
   (≥ 24px — الحد الأدنى WCAG 2.5.8) وارتفاعها ≥ 48px.
   كل أيام الشهر حاضرة وممكنة بلوحة المفاتيح — لا قصّ ولا إخفاء. */
.m-ocal[data-ocal-compact="true"] .m-ocal__gridrow {
  min-height: var(--micro-touch-min);
}

.m-ocal[data-ocal-compact="true"] .m-ocal__cell {
  min-height: var(--micro-touch-min);
}

/* خلية فارغة — لم تعد تُستخدم (عقد 2026-10-25: أيام الأشهر المجاورة
   خلايا حقيقية خافتة بدل الفراغات؛ الصنف يبقى محذوفًا من المصدر) */

/* خلية الشهر (عقد المرجع الأعلى 2.4): تشريح ثابت متطابق لكل خلية
   — chip رقم 32×28 ثم فجوة 4px ثم خانة نقاط محجوزة (6px حتى
   الفارغة) فلا يقفز أساس الرقم بين الخلايا أبدًا. بلا حدود ولا
   تعبئة على الخلية نفسها؛ أرضية ارتفاع الصف 48px أعلاه. */
.m-ocal__cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center; /* المجموعة متمركزة داخل أرضية الصف */
  gap: var(--micro-space-1);
  width: calc(100% / 7);
  min-width: 0;
  padding: 2px 0;
  border: 0;
  border-radius: 0;
  background-color: transparent; /* لا خطوط شبكة ولا تعبئة خلايا */
  color: var(--micro-text-primary);
  cursor: pointer;
}

/* chip الرقم: 32×28 بزوايا radius-md — سطح الحالة الوحيد في الخلية
   (تحديد/اليوم/الضغط) — الخلية نفسها لا تُملأ أبدًا */
.m-ocal__daynum {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 28px;
  border-radius: var(--micro-radius-field);
  font-size: var(--micro-label-size);
  font-weight: var(--micro-weight-medium);
  line-height: 1;
  font-variant-numeric: tabular-nums lining-nums;
}

/* يوم من شهر مجاور (عقد المرجع الأعلى 2.4): رقم ink-disabled ونقاط
   بشفافية 40% — لكنه يوم حقيقي قابل للتحديد (اختياره ينقل العرض
   إلى شهره). التحديد/اليوم الحالي يظلان بعلامتيهما الكاملتين فوق
   الخفوت. */
.m-ocal__cell--out .m-ocal__daynum {
  color: var(--micro-text-disabled);
}

.m-ocal__cell--out .m-ocal__dot {
  opacity: 0.4;
}

.m-ocal__cell--out.m-ocal__cell--selected .m-ocal__daynum {
  color: var(--micro-brand-ink);
}

.m-ocal__cell--out.m-ocal__cell--selected .m-ocal__dot {
  opacity: 1;
}

/* اليوم الحالي (غير المحدد) — عقد المرجع الأعلى 2.4: وزن 600 +
   حلقة 1px divider-strong على chip وحدها. والمعنى ليس باللون وحده
   (aria-current + «اليوم» في aria-label) */
.m-ocal__cell--today .m-ocal__daynum {
  box-shadow: 0 0 0 1px var(--micro-border-control);
  font-weight: var(--micro-weight-semibold);
}

/* اليوم المحدد — عقد المرجع الأعلى 2.4: chip بتعبئة brand-tint
   ورقم brand-ink بوزن 600. الخلية نفسها لا تُملأ، والنقاط تحتفظ
   بألوانها (لا حلقات بيضاء ولا حدود) */
.m-ocal__cell--selected .m-ocal__daynum {
  background-color: var(--micro-surface-selected);
  color: var(--micro-brand-ink);
  font-weight: var(--micro-weight-semibold);
}

/* اجتماعهما: نمط التحديد نفسه بلا حلقة (عقد المرجع الأعلى:
   Selected + today = selected style plus weight 600 — no ring) */
.m-ocal__cell--today.m-ocal__cell--selected .m-ocal__daynum {
  box-shadow: none;
}

/* الضغط: طبقة 8% ink-primary على chip وحده (سطح selected القائم) */
.m-ocal__cell:active:not(.m-ocal__cell--selected) .m-ocal__daynum {
  background-color: var(--micro-surface-selected);
}

/* نقاط الحالات تحت chip الرقم بفجوة 4px (عقد المرجع الأعلى 2.4):
   خانة محجوزة تُرسَم دائمًا بارتفاع 6px حتى بلا أحداث — إصلاح
   قفز الأساس؛ النقاط 6px دائرية صلبة بلا حلقات ولا توهج */
.m-ocal__dots {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--micro-space-1);
  height: 6px;
}

/* نقطة الحالة: 6×6px صلبة (قيم ثابتة لا سلم مسافات — موثق) */
.m-ocal__dot {
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: var(--micro-radius-circle);
}

.m-ocal__dot--progress { background-color: var(--micro-info); }
.m-ocal__dot--success { background-color: var(--micro-success); }
.m-ocal__dot--warning { background-color: var(--micro-warning); }
.m-ocal__dot--neutral { background-color: var(--micro-text-secondary); }

/* ================= 4) مفتاح الحالات (داخل بطاقة التقويم) =================
   عقد المرجع الأعلى 2.4: المفتاح يسكن البطاقة أسفل الشبكة (حشو
   12/16، بلا فاصل أعلاه): ثلاث بنود في صف واحد (فجوة 16، التفاف)،
   كل بند نقطة 6px + تسمية 14px/400 بلون ink-secondary (فجوة 8)،
   بالترتيب والألوان نفسهما للنقاط. */
.m-ocal__legend {
  list-style: none;
  margin: 0;
  padding: var(--micro-space-3) var(--micro-space-4);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--micro-space-2) var(--micro-space-4);
}

.m-ocal__legend-item {
  display: inline-flex;
  align-items: center;
  gap: var(--micro-space-2);
  font-size: var(--micro-label-size);
  line-height: var(--micro-label-line);
  color: var(--micro-text-secondary);
}

/* إصلاح R3-2b (2026-10-08): نص الحالة الخام (مفتاح مجهول طويل) يلتف
   داخل شريحته/مفتاحه بدل توسيع الصف أو الصفحة عند تكبير النص */
.m-ocal__legend-label,
.m-ocal__row-statuslabel {
  overflow-wrap: anywhere;
}

.m-ocal__legend-dot {
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: var(--micro-radius-circle);
}

.m-ocal__legend-dot--progress { background-color: var(--micro-info); }
.m-ocal__legend-dot--success { background-color: var(--micro-success); }
.m-ocal__legend-dot--warning { background-color: var(--micro-warning); }
.m-ocal__legend-dot--neutral { background-color: var(--micro-text-secondary); }

/* ================= 5) رأس منطقة أحداث اليوم وعرض اليوم =================
   عقد المرجع الأعلى 2.5: صف واحد (ارتفاع 44) — «طلبات اليوم» أو
   «طلبات DD/MM/YYYY» بداية السطر (17px≈18 توكن عنوان القسم/600)،
   يليه بعد 8px العدد رقمًا عاديًا (400/ink-secondary)، وزر
   «إضافة طلب» نهاية السطر (السطح البترولي المملوء الوحيد). */
.m-ocal__daypanel {
  display: flex;
  flex-direction: column;
  gap: var(--micro-space-3);
}

.m-ocal__daypanel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--micro-space-2) var(--micro-space-3);
  min-height: var(--micro-touch-min);
}

.m-ocal__daypanel-title {
  flex: 1 1 auto;
  min-width: 140px;
  margin: 0;
  font-size: var(--micro-section-title-size);
  font-weight: var(--micro-weight-semibold);
  line-height: var(--micro-section-title-line);
  color: var(--micro-text-primary);
  overflow-wrap: anywhere;
}

.m-ocal__daypanel-date {
  font-variant-numeric: tabular-nums lining-nums;
}

.m-ocal__daypanel-count {
  margin: 0;
  font-size: var(--micro-label-size);
  line-height: var(--micro-label-line);
  color: var(--micro-text-secondary);
  font-variant-numeric: tabular-nums lining-nums;
}

/* اليوم الفارغ (عقد المرجع الأعلى 2.6): سطر واحد ممركز بلا
   صناديق ولا رسوم — حشو 24/16 */
.m-ocal__daypanel-empty {
  padding: var(--micro-space-6) var(--micro-space-4);
  text-align: center;
}

/* ================= 6) صفوف الطلبات: أكورديون داخلي أحادي الفتح =================
   عقد 2026-10-26 (تعليمات المالك — التوسيع داخل الصف): سطح البطاقة
   (radius-lg 16، حد خافت واحد، بلا ظل) على .m-ocal__rowitem نفسه،
   والمشغّل .m-ocal__row بداخله بلا حدود (شبكة «عمود محتوى + سهم
   اتجاهي 20px» بفجوة 12، ارتفاع أدنى 76px، حشو 12/16) — منطقة
   الإفصاح .m-ocal__rowpanel تُرسم داخل الصف نفسه أسفل المشغّل فتبقى
   التفاصيل والأفعال ملاصقة للطلب المحدد (لا صندوق منفصل أسفل
   القائمة). عمود المحتوى سطران (فجوة 4): العنوان + الوقت نصًا
   عاديًا، ثم العميل + شارة الحالة. البطاقات تتباعد 8px، والضغط
   طبقة 8% ink-primary، والسهم يدور نحو الأسفل عند الفتح. */
.m-ocal__rows {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--micro-space-2);
}

.m-ocal__rowitem {
  display: flex;
  flex-direction: column;
  min-width: 0;
  border: 1px solid var(--micro-border-divider);
  border-radius: var(--micro-radius-surface);
  background-color: var(--micro-surface-base);
}

.m-ocal__row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 20px;
  column-gap: var(--micro-space-3);
  align-items: center;
  width: 100%;
  min-width: 0;
  min-height: 76px;
  padding: var(--micro-space-3) var(--micro-space-4);
  border: 0;
  border-radius: var(--micro-radius-surface);
  background-color: transparent;
  color: var(--micro-text-primary);
  text-align: start;
  cursor: pointer;
}

.m-ocal__row:active {
  background-color: var(--micro-seg-hover-surface);
}

/* عمود المحتوى: سطران بفجوة 4px */
.m-ocal__row-main {
  display: flex;
  flex-direction: column;
  gap: var(--micro-space-1);
  min-width: 0;
}

.m-ocal__row-line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--micro-space-2);
  min-width: 0;
}

/* العنوان: سطر واحد بقطع بصري — النص الكامل باقٍ في DOM وشجرة
   الإتاحة (قراءة كاملة لقارئ الشاشة)؛ العنوان الطويل لا يدفع
   الوقت ولا السهم (عقد المرجع الأعلى 5.5) */
.m-ocal__row-title {
  flex: 0 1 auto;
  min-width: 0;
  font-size: var(--micro-body-size);
  font-weight: var(--micro-weight-medium);
  line-height: var(--micro-body-line);
  color: var(--micro-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* الوقت: نص عادي 15px≈14 توكن التسمية/500/ink-strong بأرقام
   ثابتة العرض داخل bdi معزول — بلا أيقونة ساعة ولا شريحة (عقد
   المرجع الأعلى 2.6: الوقت ليس حالة) */
.m-ocal__row-time {
  flex: none;
  direction: ltr;
  unicode-bidi: isolate;
  font-size: var(--micro-label-size);
  font-weight: var(--micro-weight-medium);
  line-height: var(--micro-label-line);
  color: var(--micro-text-primary);
  font-variant-numeric: tabular-nums lining-nums;
}

.m-ocal__row-customer,
.m-ocal__row-date {
  flex: 0 1 auto;
  min-width: 0;
  font-size: var(--micro-label-size);
  line-height: var(--micro-label-line);
  color: var(--micro-text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.m-ocal__row-placeholder { flex: 1 1 0; }

/* سهم البطاقة الاتجاهي 20px بلون ink-tertiary (توكن التلميح) —
   يتبع الاتجاه من المكوّن (يسار في RTL، يمين في LTR) ويدور نحو
   الأسفل عند الفتح (الحالة ليست باللون وحده) */
.m-ocal__row-chev {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  color: var(--micro-text-hint);
  transition: transform var(--micro-motion-focus) var(--micro-ease-standard);
}

/* ---- منطقة الإفصاح داخل الصف (عقد 2026-10-26): تفاصيل + أفعال
   ملاصقة للطلب المحدد — العنوان الكامل (يلتف بلا قطع)، صفوف تعريف
   رقمية (التسمية بداية السطر والقيمة نهايته)، ثم أزرار الفعل ---- */
.m-ocal__rowpanel {
  display: flex;
  flex-direction: column;
  gap: var(--micro-space-2);
  padding: var(--micro-space-1) var(--micro-space-4) var(--micro-space-3);
}

.m-ocal__rowpanel[hidden] { display: none; }

.m-ocal__rowpanel-title {
  margin: 0;
  font-size: var(--micro-body-size);
  font-weight: var(--micro-weight-semibold);
  line-height: var(--micro-body-line);
  color: var(--micro-text-primary);
  overflow-wrap: anywhere;
}

.m-ocal__rowdetails {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: var(--micro-space-1);
  min-width: 0;
}

.m-ocal__rowdetail {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--micro-space-3);
  min-width: 0;
}

.m-ocal__rowdetail dt {
  flex: none;
  font-size: var(--micro-label-size);
  line-height: var(--micro-label-line);
  color: var(--micro-text-secondary);
}

.m-ocal__rowdetail dd {
  margin: 0;
  min-width: 0;
  text-align: end;
  font-size: var(--micro-label-size);
  line-height: var(--micro-label-line);
  color: var(--micro-text-primary);
  font-variant-numeric: tabular-nums lining-nums;
  overflow-wrap: anywhere;
}

.m-ocal__rowdetail .m-ocal__row-status { flex: none; }

/* أفعال الصف المفتوح: أزرار محدودة (بلا تعبئة brand — السطح
   المملوء الوحيد «إضافة طلب»)؛ الحذف بلون الخطر النصي على
   السطح القائم (الكلمة تحمل المعنى والتلوين ثانوي) */
.m-ocal__rowtools {
  display: flex;
  flex-wrap: wrap;
  gap: var(--micro-space-2);
  margin-block-start: var(--micro-space-1);
}

.m-ocal__rowtool {
  min-height: var(--micro-touch-min); /* ≥ 48px */
  padding: var(--micro-button-padding-block) var(--micro-button-padding-inline);
  border: 1px solid var(--micro-border-divider);
  border-radius: var(--micro-radius-button-long);
  background-color: var(--micro-surface-base);
  color: var(--micro-text-primary);
  font-size: var(--micro-label-size);
  font-weight: var(--micro-weight-medium);
  line-height: 1;
  cursor: pointer;
}

.m-ocal__rowtool:hover,
.m-ocal__rowtool:active {
  background-color: var(--micro-seg-hover-surface);
}

.m-ocal__rowtool--danger {
  color: var(--micro-danger);
}

/* الحالة: شارة نصية بلون الحالة الدلالي على تينته — النص وحده
   يحمل المعنى (R-24)؛ عقد المرجع الأعلى 2.6: حشو 2/8 وزوايا chip
   (أقرب توكن قائم لradius-sm — لا نصف قطر جديد) */
.m-ocal__row-status {
  display: inline-flex;
  align-items: center;
  padding: 2px var(--micro-space-2);
  border-radius: var(--micro-radius-chip);
  font-size: var(--micro-label-size);
  font-weight: var(--micro-weight-medium);
  line-height: var(--micro-label-line);
  overflow-wrap: anywhere;
  max-width: 100%;
}

.m-ocal__row-status--progress {
  background-color: var(--micro-info-surface);
  color: var(--micro-info);
}

.m-ocal__row-status--success {
  background-color: var(--micro-success-surface);
  color: var(--micro-success);
}

.m-ocal__row-status--warning {
  background-color: var(--micro-warning-surface);
  color: var(--micro-warning);
}

.m-ocal__row-status--neutral {
  background-color: var(--micro-surface-page);
  color: var(--micro-text-secondary);
}

/* الملاحظة القصيرة تُعرض في منطقة الإفصاح داخل الصف (عقد 2026-10-26) — لا عنصر مخصص على وجه البطاقة. */
.m-ocal__row-note { display: none; }

/* ================= 6b) نطاق الأسبوع =================
   نطاق الأسبوع في شريط الأسبوع — تعبير رقمي خالص يُعزل LTR كي
   لا يقلب ترتيب أجزائه في سياق RTL (أرقام لاتينية 0-9 في كل
   الاتجاهات). */
.m-ocal__week-range {
  direction: ltr;
  unicode-bidi: isolate;
  font-size: var(--micro-button-label-size);
  font-weight: var(--micro-weight-semibold);
  line-height: var(--micro-button-label-line);
  color: var(--micro-text-primary);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

/* ================= 7) شاشة القائمة ================= */
.m-ocal__list-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--micro-space-2);
}

.m-ocal__list-section {
  display: flex;
  flex-direction: column;
  gap: var(--micro-space-2);
}

.m-ocal__list-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--micro-space-2);
}

<script>
/* =========================================================
   Micro UI — سلوك مكوّن جدول الطلبات المجدولة (order-schedule)
   الملف: components/order-schedule/order-schedule.js
   الاسم العالمي: window.MicroOrderSchedule — البادئة m-ocal.

   عقد عام (المفصّل في specification.md):
   MicroOrderSchedule.init(rootElement, options) → instance
   instance / MicroOrderSchedule.getInstance(root):
     setData(orders)             تحديث كامل بلا إعادة تهيئة
     setSelectedDate('YYYY-MM-DD')
     setView('calendar'|'list')
     setCalendarView('month'|'week'|'day')
     getState()                 نسخة من حالة العرض والتحديد
     setDisplayedMonth('YYYY-MM') تصفح شهر مستقل وصامت
     setLoading(true|false)
     setError(retryCallback|null)
     destroy()
   options: orders, statuses, today, weekStart, selectedDate, displayedMonth, view,
            calendarView ('month'|'week'|'day'), orderActions{edit,delete},
            headingLevel, loading, retry
   أحداث CustomEvent على الجذر (bubbles):
     order-schedule:day-select           {date:'YYYY-MM-DD'}
     order-schedule:state-change         {view,calendarView,selectedDate,displayedMonth}
     order-schedule:order-open           {id}
     order-schedule:add-request          {date:'YYYY-MM-DD'|null}
     order-schedule:order-edit-request   {id}
     order-schedule:order-delete-request {id}

   عقد 2026-10-25 (مرجع المالك calendar-reference-implementation.html):
   محدّد يوم/أسبوع/شهر حقيقي بثلاث حالات فاعلة (لا بديل «قائمة»
   فيه — القائمة سطح منفصل عبر setView('list') يستدعيه المضيف).
   الشهر: شبكة سبعة أعمدة بأيام الشهر المعروض + أيام الأشهر
   المجاورة خافتة قابلة للتحديد (العرض يتبع التحديد)، ثم منطقة
   «طلبات اليوم» أسفل الشبكة (عنوان + عبارة عدد + إضافة + بطاقات
   صفوف مدمجة). الأسبوع: صف الأسبوع الذي يحوي اليوم المحدد +
   نفس منطقة الأحداث. اليوم: شريط اليوم + صفوفه. لا عرضا
   expanded/agenda بعد الآن (عقد ملغٍ 2026-10-25 — منطقة الأحداث
   ظاهرة دائمًا أسفل الشبكة كما في المرجع).

   عقد 2026-10-25 (calendar-target-latest-owner.png — دقة بصرية):
   1) بداية الأسبوع الأحد: الافتراضي weekStart=0 (كان 6/السبت) —
      الترتيب المرئي LTR: أحد..سبت يسارًا-يمينًا، وRTL يعكس الأسبوع
      المنطقي نفسه (الأحد في بداية RTL المنطقية) والرقم/النقاط/
      التحديد/اليوم تبقى مرتبطة بالتاريخ نفسه في الاتجاهين.
      المستهلك الذي يمرر weekStart صريحًا يبقى مدعومًا — الهجرة
      موثقة في specification.md.
   2) أرقام فقط على السطح المرئي: التواريخ الكاملة DD/MM/YYYY،
      وأرقام لاتينية 0-9 لليوم/الشهر/السنة/الوقت.

   عقد 2026-10-25 (CALENDAR-MONTH-VISUAL-REFINEMENT-INSTRUCTIONS —
   المرجع الأعلى لتقديم شهر التقويم؛ يسقط ما تعارض معه مما سبق):
   أ) [مُلغى بعقد 2026-10-26 أدناه — رأس الشهر رقمي «10 / 2026»]
   ب) محدد واحد مقسّم (يوم/أسبوع/شهر) role=tablist/tab/aria-selected
      بسطح غارق ومقطع نشط brand-tint — لا تعبئة brand.
   ج) لا خطوط شبكة داخلية إطلاقًا — الإيقاع من الفراغ؛ البطاقة حد
      خافت واحد بلا ظل.
   د) تشريح خلية ثابت: chip رقم 32×28 radius-md + خانة نقاط محجوزة
      تُرسَم دائمًا (ارتفاع 6px حتى الفارغة) فلا قفز أساس الرقم.
   هـ) التحديد = chip بتعبئة brand-tint وchip اليوم بحلقة 1px
      divider-strong — الخلية نفسها لا تُملأ أبدًا.
   و) مفتاح الحالات داخل البطاقة أسفل الشبكة.
   ز) [مُعدّل بعقد 2026-10-26 أدناه] بطاقة الطلب بلا أزرار تعديل/حذف
      دائرية على وجهها: البطاقة مشغّل أكورديون داخلي (التفاصيل
      والأفعال داخل الصف نفسه).

   عقد 2026-10-26 (تعليمات المالك الأحدث — «الأرقام فقط + مبدّل
   تقويم/قائمة + أكورديون داخلي»؛ يسقط ما تعارض معه مما سبق):
   1) الأرقام فقط على كل السطح: رأس الشهر «10 / 2026» (شهر/سنة
      رقميان بتدرّج وزن/لون) — لا اسم شهر مرئيًا في أي مكان، ولا
      في الأسماء الإتاحية (خلية اليوم «07/10/2026، طلبان» وخيارات
      المنتقي «10 / 2026» رقمية أيضًا). أسماء الأيام تبقى (ليست
      أسماء أشهر). يلغي بند (أ) أعلاه.
   2) مبدّل تقويم/قائمة مستقل (data-ocal-action="mode-toggle") في
      صف التحكم منفصلًا عن المحدد المقسّم: التسمية تصف فعل الضغط
      («عرض القائمة» في وضع التقويم، «عرض التقويم» في القائمة)
      وaria-pressed يعرض الحالة الحقيقية (true = القائمة فاعلة).
      المحدد المقسّم يُرسم في وضع التقويم فقط.
   3) أكورديون داخلي أحادي الفتح لصفوف الطلب: الضغط على البطاقة
      يفتح منطقة إفصاح داخل صف الطلب نفسه (لا صندوق منفصل أسفل
      القائمة) بـrole=region ومعرف فريد يربطه aria-expanded/
      aria-controls بالمشغّل؛ فتح طلب يغلق غيره، وضغط المفتوح
      يطويه، وorder-open يطلق مرة واحدة عند الفتح. أزرار تعديل/
      حذف داخل المنطقة (عند تفعيل orderActions) — نقرها لا يطوي
