<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobile Calendar - Month View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&display=swap" rel="stylesheet">

<!--
=====================================================================
 DESIGN SPEC (for the coding agent) - read this before implementing
=====================================================================
 Screen: mobile calendar, "Month" view, portrait, ~390 x 800 design size.
 Background: warm off-white. Accent: soft violet. Everything is rounded,
 soft shadows, no hard borders (grid lines are ~6% opacity only).

 VERTICAL STRUCTURE (top -> bottom)
   1. Header row ........ back chevron (left) | title "Calendar" (center,
                          800 weight, 22px) | circular avatar 38px (right)
   2. Controls row ...... [filter btn 44x44] [segmented Day|Week|Month,
                          flexible width] [add-event btn 44x44]
                          - buttons: white, radius 14, soft shadow
                          - segmented: white pill, active segment filled
                            violet gradient with white text
   3. Month navigator ... « (prev)   "July" (ink) + "2026" (violet) + chevron-down   » (next)
   4. Calendar card ..... white-ish card, radius 20, soft shadow
                          - weekday row: Su Mo Tu We Th Fr Sa (bold 12px)
                          - day grid: 7 columns, rows = 5 or 6, row height 56px
                          - cell = day number + dot row beneath it
                          - days outside current month: grey number, dots at 35% opacity
                          - selected day: number sits in a violet rounded
                            square (28x24, radius 8) with white text + glow
                          - event dots: 4px circles, violet, with glow
                            (box-shadow 0 0 5px). Max 3 dots per day.
                          - cell separators: 1px lines at rgba(60,50,90,.06)
   5. "Events today" ... bold 20px heading, then a vertical list of cards
   6. Event card ........ radius 16, vertical gradient (darker top, lighter
                          bottom), white text. Row 1: title (bold) left,
                          clock icon + "09:00 - 10:00" right. Row 2: small
                          calendar icon + group/calendar name.
                          Tones: purple, blue (slate), lavender (dark text).
   7. Bottom nav ........ FLOATING pill (not attached to screen edges):
                          absolute, 14px from left/right/bottom, height 58,
                          white, radius 29, big soft shadow.
                          Icons: home (active = violet), grid, FAB (+),
                          search, bell with small red dot.
                          FAB: 54px violet circle raised ~22px above the pill.
   Content area scrolls under the nav (padding-bottom ~110px).

 DRAWING NOTES
   - Calendar grid is CSS Grid (repeat(7, 1fr)), NOT a <table>. Cells are <button>s.
   - Grid days are computed: start = first of month minus weekday offset,
     length = ceil((offset + daysInMonth) / 7) * 7.
   - All icons are inline SVG, stroke = currentColor, stroke-width 2, round caps.
   - Colors/sizes live in CSS variables at :root - change them there only.
   - Data is plain JS (EVENTS array). Dots are derived from event count per date.
   - The demo is pinned to TODAY = 2026-07-20 to match the reference screenshot.
=====================================================================
-->

<style>
:root{
  --page:#e8e4de;
  --bg:#f4f0eb;
  --surface:#fbfaf8;
  --ink:#2b2733;
  --muted:#b8b3ad;
  --accent:#8d7cb9;
  --accent-2:#a597cc;
  --accent-deep:#6d5c9a;
  --nav-icon:#8f88a3;
  --danger:#e5484d;
  --line:rgba(60,50,90,.06);
  --shadow-sm:0 4px 12px rgba(80,66,110,.10);
  --shadow-md:0 10px 28px rgba(80,66,110,.16);
  --font:'Gabarito','Outfit','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--page);
  font-family:var(--font);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}

/* ---------- Phone frame (demo chrome only) ---------- */
.phone{
  position:relative;
  width:390px;height:min(820px,calc(100vh - 32px));
  background:var(--bg);
  border:7px solid #0d0d0f;
  border-radius:44px;
  overflow:hidden;
  box-shadow:0 30px 60px rgba(40,30,70,.25);
}
.screen{
  height:100%;overflow-y:auto;
  padding:20px 16px 120px;
  scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none}

/* ---------- 1. Header ---------- */
.header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.header .back{width:32px;height:32px;display:grid;place-items:center}
.header h1{text-align:center;font-size:22px;font-weight:800;letter-spacing:.2px}
.avatar{
  width:40px;height:40px;border-radius:50%;justify-self:end;overflow:hidden;
  border:2px solid #fff;box-shadow:var(--shadow-sm);
}

/* ---------- 2. Controls ---------- */
.controls{display:flex;align-items:center;gap:10px;margin-top:18px}
.sq{
  width:46px;height:46px;border-radius:15px;background:var(--surface);
  display:grid;place-items:center;box-shadow:var(--shadow-sm);color:var(--accent-deep);
  flex:none;
}
.seg{
  flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;
  background:var(--surface);border-radius:20px;padding:5px;box-shadow:var(--shadow-sm);
}
.seg button{height:36px;border-radius:15px;font-weight:600;font-size:15px;color:#4a4458}
.seg button.active{
  background:linear-gradient(180deg,var(--accent-2),var(--accent));
  color:#fff;font-weight:700;box-shadow:0 5px 12px rgba(141,124,185,.5);
}

/* ---------- 3. Month navigator ---------- */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 12px}
.monthnav .step{width:36px;height:36px;display:grid;place-items:center;color:var(--ink)}
.monthnav .label{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:800}
.monthnav .year{color:var(--accent)}
.monthnav .label svg{color:var(--accent)}

/* ---------- 4. Calendar card ---------- */
.cal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-sm);padding:2px 0 4px;overflow:hidden}
.dow,.week{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;font-weight:800;font-size:12px;padding:14px 0 10px}
.day{
  height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  border-top:1px solid var(--line);border-left:1px solid var(--line);
}
.day:nth-child(7n+1){border-left:0}
.num{width:30px;height:25px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px}
.day.out .num{color:var(--muted)}
.day.sel .num{
  background:var(--accent);color:#fff;
  box-shadow:0 5px 12px rgba(141,124,185,.5);
}
.dots{height:5px;display:flex;gap:3px;align-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 5px rgba(141,124,185,.85)}
.day.out .dot{opacity:.35}

/* ---------- 5/6. Events ---------- */
.events h2{font-size:20px;font-weight:800;margin:22px 4px 12px}
.event{
  display:grid;grid-template-columns:1fr auto;gap:12px 10px;align-items:center;
  border-radius:16px;padding:16px 18px;margin-bottom:12px;color:#fff;
  background:linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:0 8px 18px rgba(80,66,110,.18);
}
.event .title{font-weight:700;font-size:16px;line-height:1.25}
.event .time{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.event .group{grid-column:1 / -1;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;opacity:.9}
.tone-purple{--c1:#5f4f84;--c2:#8a7bb2}
.tone-blue{--c1:#40657f;--c2:#6a8fab}
.tone-lavender{--c1:#d4cbea;--c2:#bcb0de;color:#3a3150}
.empty{padding:26px 8px;text-align:center;color:#9a94a8;font-weight:600}

/* ---------- 7. Bottom nav ---------- */
.nav{
  position:absolute;left:14px;right:14px;bottom:14px;height:58px;
  background:#fff;border-radius:29px;box-shadow:var(--shadow-md);
  display:flex;align-items:center;justify-content:space-around;padding:0 10px;
}
.nav button{width:44px;height:44px;display:grid;place-items:center;color:var(--nav-icon);position:relative}
.nav button.active{color:var(--accent)}
.nav .fab{
  width:54px;height:54px;border-radius:50%;margin-top:-26px;color:#fff;
  background:linear-gradient(180deg,var(--accent-2),var(--accent-deep));
  box-shadow:0 10px 20px rgba(109,92,154,.5);
}
.nav .badge{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:1.5px solid #fff}

/* ---------- Real phones: drop the demo frame ---------- */
@media (max-width:430px){
  body{padding:0;display:block}
  .phone{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}
}
</style>
</head>
<body>

<!-- SVG icon sprite: stroke icons, 24x24 viewBox -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-dbl-left" viewBox="0 0 24 24"><path d="M12 6l-6 6 6 6M19 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-dbl-right" viewBox="0 0 24 24"><path d="M5 6l6 6-6 6M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h9M19 8h1M4 16h1M11 16h9"/><circle cx="16" cy="8" r="2.4"/><circle cx="8" cy="16" r="2.4"/></g></symbol>
    <symbol id="i-cal-plus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17M12 13.2v4.6M9.7 15.5h4.6"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></g></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.2L12 4l8 7.2V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.2H9v5.2H5.5A1.5 1.5 0 0 1 4 19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></g></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></g></symbol>
  </defs>
</svg>

<main class="phone">
  <div class="screen" id="screen">

    <!-- 1. Header -->
    <header class="header">
      <button class="back" aria-label="Back"><svg width="20" height="20"><use href="#i-back"/></svg></button>
      <h1>Calendar</h1>
      <div class="avatar" aria-label="Profile">
        <!-- placeholder avatar: replace with <img> -->
        <svg viewBox="0 0 40 40" width="40" height="40">
          <rect width="40" height="40" fill="#d9cfe8"/>
          <path d="M6 40c1-9 7-13 14-13s13 4 14 13z" fill="#7d6fb0"/>
          <ellipse cx="20" cy="17" rx="9.5" ry="11" fill="#e9c6a6"/>
          <path d="M9.5 18c-1-9 4-13 10.5-13s11.5 4 10.5 13c-1.5-5-4-7-10.5-7S11 13 9.5 18z" fill="#d9b25a"/>
          <path d="M9.5 18c-1 6 0 11 2 14 0-5 1-9 2-12zM30.5 18c1 6 0 11-2 14 0-5-1-9-2-12z" fill="#d9b25a"/>
        </svg>
      </div>
    </header>

    <!-- 2. Controls -->
    <section class="controls">
      <button class="sq" aria-label="Filters"><svg width="22" height="22"><use href="#i-sliders"/></svg></button>
      <div class="seg" id="seg" role="tablist">
        <button data-mode="day">Day</button>
        <button data-mode="week">Week</button>
        <button data-mode="month" class="active">Month</button>
      </div>
      <button class="sq" aria-label="Add event"><svg width="22" height="22"><use href="#i-cal-plus"/></svg></button>
    </section>

    <!-- 3. Month navigator -->
    <section class="monthnav">
      <button class="step" id="prev" aria-label="Previous"><svg width="22" height="22"><use href="#i-dbl-left"/></svg></button>
      <div class="label"><span id="mName">July</span><span class="year" id="mYear">2026</span><svg width="16" height="16"><use href="#i-down"/></svg></div>
      <button class="step" id="next" aria-label="Next"><svg width="22" height="22"><use href="#i-dbl-right"/></svg></button>
    </section>

    <!-- 4. Calendar card (rendered by JS) -->
    <section class="cal" id="cal">
      <div class="dow" id="dow"></div>
      <div id="weeks"></div>
    </section>

    <!-- 5. Events -->
    <section class="events">
      <h2 id="evTitle">Events today</h2>
      <div id="evList"></div>
    </section>
  </div>

  <!-- 7. Floating bottom nav -->
  <nav class="nav" aria-label="Main">
    <button class="active" aria-label="Home"><svg width="24" height="24"><use href="#i-home"/></svg></button>
    <button aria-label="Overview"><svg width="24" height="24"><use href="#i-grid"/></svg></button>
    <button class="fab" aria-label="New"><svg width="26" height="26"><use href="#i-plus"/></svg></button>
    <button aria-label="Search"><svg width="24" height="24"><use href="#i-search"/></svg></button>
    <button aria-label="Notifications"><svg width="24" height="24"><use href="#i-bell"/></svg><i class="badge"></i></button>
  </nav>
</main>

<script>
/* ---------- Data ---------- */
const TODAY = new Date(2026, 6, 20);           // pinned to match the screenshot
const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// e(date, title, start, end, group, tone)  tone: purple | blue | lavender
const e = (date,title,start,end,group,tone='purple') => ({date,title,start,end,group,tone});
const EVENTS = [
  e('2026-07-08','Soccer practice','16:00','17:30','Dunphy Family'),
  e('2026-07-11','Open house','11:00','13:00',"Phil's work",'blue'),
  e('2026-07-12','Family brunch','10:00','11:30','Dunphy Family','lavender'),
  e('2026-07-14','Parent call','08:30','09:00','Dunphy Family'),
  e('2026-07-16','Site visit','14:00','15:00',"Phil's work",'blue'),
  e('2026-07-18','Dance recital','18:00','19:30','Dunphy Family'),
  e('2026-07-20','PTA meeting','09:00','10:00','Dunphy Family','purple'),
  e('2026-07-20','Client meeting - Elm Street property','10:00','11:00',"Phil's work",'blue'),
  e('2026-07-20','Dinner at Gloria\'s','19:00','21:00','Dunphy Family','lavender'),
  e('2026-07-21','Dentist','09:30','10:15','Dunphy Family'),
  e('2026-07-22','Listing photos','13:00','14:00',"Phil's work",'blue'),
  e('2026-07-23','Piano lesson','16:30','17:15','Dunphy Family','lavender'),
  e('2026-07-25','Garage sale','08:00','12:00','Dunphy Family'),
  e('2026-07-26','Movie night','20:00','22:00','Dunphy Family','lavender'),
  e('2026-07-28','Contract signing','11:00','12:00',"Phil's work",'blue'),
  e('2026-07-30','School trip','07:30','15:00','Dunphy Family'),
  e('2026-08-02','Beach day','10:00','16:00','Dunphy Family','lavender'),
];

/* ---------- State ---------- */
let selected = new Date(TODAY);
let view = { y: TODAY.getFullYear(), m: TODAY.getMonth() };
let mode = 'month';                              // day | week | month

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const eventsOn = k => EVENTS.filter(x => x.date === k).sort((a,b) => a.start.localeCompare(b.start));
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);

// Grid days for a month: starts on Sunday, length is a multiple of 7
function gridDays(y, m){
  const first = new Date(y, m, 1);
  const offset = first.getDay();
  const count = new Date(y, m+1, 0).getDate();
  const total = Math.ceil((offset + count) / 7) * 7;
  return Array.from({length: total}, (_, i) => new Date(y, m, 1 - offset + i));
}

/* ---------- Render ---------- */
function renderCalendar(){
  $('#dow').innerHTML = DOW.map(d => `<span>${d}</span>`).join('');
  let days = gridDays(view.y, view.m);

  if (mode === 'week'){
    const idx = days.findIndex(d => key(d) === key(selected));
    const row = Math.floor((idx < 0 ? 0 : idx) / 7);
    days = days.slice(row*7, row*7 + 7);
  }

  const cells = days.map(d => {
    const k = key(d);
    const n = Math.min(eventsOn(k).length, 3);
    const cls = ['day'];
    if (d.getMonth() !== view.m) cls.push('out');
    if (k === key(selected)) cls.push('sel');
    return `<button class="${cls.join(' ')}" data-key="${k}">
      <span class="num">${d.getDate()}</span>
      <span class="dots">${'<i class="dot"></i>'.repeat(n)}</span>
    </button>`;
  }).join('');

  $('#weeks').innerHTML = `<div class="week" style="display:grid;grid-template-columns:repeat(7,1fr)">${cells}</div>`;
  $('#cal').style.display = mode === 'day' ? 'none' : '';
  $('#mName').textContent = MONTHS[view.m];
  $('#mYear').textContent = view.y;
}

const clockIcon = '<svg width="14" height="14"><use href="#i-clock"/></svg>';
const calIcon   = '<svg width="14" height="14"><use href="#i-cal"/></svg>';

function renderEvents(){
  const k = key(selected);
  const isToday = k === key(TODAY);
  $('#evTitle').textContent = isToday
    ? 'Events today'
    : `Events - ${DOW[selected.getDay()]}, ${MONTHS[selected.getMonth()].slice(0,3)} ${selected.getDate()}`;
  const list = eventsOn(k);
  $('#evList').innerHTML = list.length ? list.map(ev => `
    <article class="event tone-${ev.tone}">
      <div class="title">${ev.title}</div>
      <div class="time">${clockIcon}${ev.start} - ${ev.end}</div>
      <div class="group">${calIcon}${ev.group}</div>
    </article>`).join('') : '<div class="empty">No events</div>';
}

function render(){
  renderCalendar();
  renderEvents();
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
}

/* ---------- Interaction ---------- */
function setSelected(d){
  selected = d;
  view = { y: d.getFullYear(), m: d.getMonth() };
  render();
}

function shift(dir){
  if (mode === 'day')  return setSelected(addDays(selected, dir));
  if (mode === 'week') return setSelected(addDays(selected, 7*dir));
  // month: keep the same day-of-month, clamped to the target month length
  const y = view.y, m = view.m + dir;
  const target = new Date(y, m, 1);
  const last = new Date(target.getFullYear(), target.getMonth()+1, 0).getDate();
  setSelected(new Date(target.getFullYear(), target.getMonth(), Math.min(selected.getDate(), last)));
}

$('#weeks').addEventListener('click', ev => {
  const btn = ev.target.closest('.day');
  if (!btn) return;
  const [y,m,d] = btn.dataset.key.split('-').map(Number);
  setSelected(new Date(y, m-1, d));
});
$('#seg').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  mode = b.dataset.mode;
  render();
});
$('#prev').addEventListener('click', () => shift(-1));
$('#next').addEventListener('click', () => shift(1));

render();
</script>
</body>
</html>
