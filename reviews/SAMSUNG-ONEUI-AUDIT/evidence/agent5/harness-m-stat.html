<!DOCTYPE html>
<!-- SUI-A5 / Agent 5 independent harness for D2 (m-stat long number at 200%).
     Pure measurement harness — links ONLY existing repo stylesheets, no edits
     to any repo file. Card width 288px = the 320 viewport minus 16px margins,
     same geometry the data preview panel uses at 320. -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A5 harness — m-stat long number</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../../../shared/tokens.css">
  <link rel="stylesheet" href="../../../../components/data/data.css">
  <style>
    body { margin: 0; background: var(--micro-surface-page); font-family: var(--micro-font-family); }
    .wrap { padding: 16px; max-width: 288px; }
    .card { background: var(--micro-surface-base); border: 1px solid var(--micro-border-subtle); border-radius: var(--micro-radius-lg, 12px); padding: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="m-stat card" id="h-stat">
      <span class="m-stat__label">إجمالي المبيعات — قيمة اختبارية طويلة</span>
      <span class="m-stat__value"><span class="m-stat__num" id="h-num" dir="ltr">7,543,210,986.55</span><span class="m-stat__unit">د.أ</span>
      </span>
    </div>
    <div class="m-stat card" id="h-stat2">
      <span class="m-stat__label">قيمة قصيرة للمقارنة</span>
      <span class="m-stat__value"><span class="m-stat__num" id="h-num2" dir="ltr">1,240.50</span><span class="m-stat__unit">د.أ</span>
      </span>
    </div>
  </div>
</body>
</html>
