<!DOCTYPE html>
<!-- Agent 4 — isolated component harness (evidence only, not a source file):
     m-stat (B05) with long number + unit + delta in a 288px container at 320,
     plus bubbles area proportionality + zero/unknown states. -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent4 isolated m-stat + bubbles</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../../../shared/tokens.css">
  <link rel="stylesheet" href="../../../../components/data/data.css">
  <style>
    body { font-family: var(--micro-font-family); margin: 16px; }
    .box { box-sizing: border-box; width: 288px; max-width: 100%; padding: 12px; border: 1px dashed var(--micro-border-divider); border-radius: 8px; }
  </style>
</head>
<body>
  <div class="box" id="stat-box">
    <div class="m-stat" id="stat1">
      <span class="m-stat__label">إجمالي المبيعات — اليوم</span>
      <span class="m-stat__value"><span class="m-stat__num">1,240.50</span><span class="m-stat__unit">د.أ</span>
        <span class="m-stat__delta m-stat__delta--up m-stat__delta--tone-positive">+12%</span>
      </span>
    </div>
  </div>
  <div class="box" id="stat-box2">
    <div class="m-stat" id="stat2">
      <span class="m-stat__label">مبلغ طويل</span>
      <span class="m-stat__value"><span class="m-stat__num">123,456.789</span><span class="m-stat__unit">د.أ</span></span>
    </div>
  </div>
  <div class="box">
    <div class="m-chart" data-chart="bubbles" data-max="100" data-title="فقاعات">
      <ul class="m-chart__data" hidden>
        <li data-series="a" data-label="أ" data-value="100"></li>
        <li data-series="b" data-label="ب" data-value="25"></li>
        <li data-series="c" data-label="ج" data-value="4"></li>
        <li data-series="d" data-label="د" data-value="0"></li>
        <li data-series="e" data-label="هـ" data-value=""></li>
      </ul>
      <div class="m-chart__plot" data-plot></div>
    </div>
  </div>
  <script src="../../../../components/data/data.js"></script>
</body>
</html>
