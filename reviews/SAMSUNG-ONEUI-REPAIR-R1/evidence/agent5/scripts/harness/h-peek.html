<!DOCTYPE html>
<!-- الوكيل 5 — هارنس مستقل: SUI-007 peek موسّط عند أول كشف
     سيناريو مختلف: قسم مخفي يحوي 3 بطاقات، وكشف بإزالة hidden (لا بعرض)،
     وتغير عرض الأب بلا window-resize، وإخفاء/كشف متكرر. -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A5 — peek عند أول كشف</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../../shared/tokens.css">
  <link rel="stylesheet" href="../../../../../components/info-strip/info-strip.css">
  <link rel="stylesheet" href="../../../../../components/info-strip/info-strip-peek.css">
  <script src="../../../../../components/info-strip/info-strip.js"></script>
  <script src="../../../../../components/info-strip/info-strip-peek.js"></script>
  <style>
    body{font-family:var(--micro-font-family);margin:12px;background:var(--micro-surface-page)}
    .host{width:320px;border:1px dashed #B9C6C2;padding:8px;transition:none}
    section.hidden{display:none}
  </style>
</head>
<body>
  <button id="reveal-btn" type="button">كشف القسم</button>
  <button id="widen-btn" type="button">عرض الأب 360</button>
  <section class="hidden" id="peek-section" aria-label="بطاقات">
    <div class="host" id="peek-host">
      <div class="m-info-strip m-info-peek" data-info-strip data-info-peek aria-label="ملخصات">
        <div class="m-info-strip__viewport" data-info-strip-viewport role="group" tabindex="0" aria-label="ملخصات">
          <div class="m-info-strip__track" data-info-strip-track>
            <div class="m-info-strip__slide">
              <article class="m-info-card">
                <span class="m-info-card__label">إجمالي</span>
                <span class="m-info-card__reading"><span class="m-info-card__number" dir="ltr">120</span><span class="m-info-card__unit">دينار</span></span>
              </article>
            </div>
            <div class="m-info-strip__slide">
              <article class="m-info-card">
                <span class="m-info-card__label">مشمول</span>
                <span class="m-info-card__reading"><span class="m-info-card__number" dir="ltr">12</span><span class="m-info-card__unit">عنصر</span></span>
              </article>
            </div>
            <div class="m-info-strip__slide">
              <article class="m-info-card">
                <span class="m-info-card__label">متوسط</span>
                <span class="m-info-card__reading"><span class="m-info-card__number" dir="ltr">10</span><span class="m-info-card__unit">دينار</span></span>
              </article>
            </div>
          </div>
        </div>
        <div class="m-info-strip__controls" data-info-strip-controls>
          <div class="m-info-strip__arrows">
            <button class="m-info-strip__arrow" type="button" data-info-strip-prev aria-label="البطاقة السابقة">‹</button>
            <button class="m-info-strip__arrow" type="button" data-info-strip-next aria-label="البطاقة التالية">›</button>
          </div>
        </div>
        <span class="m-info-strip__status" data-info-strip-status aria-live="polite" aria-atomic="true"></span>
      </div>
    </div>
  </section>
</body>
</html>
