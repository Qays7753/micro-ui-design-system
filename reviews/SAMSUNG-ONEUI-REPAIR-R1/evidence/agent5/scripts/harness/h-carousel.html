<!DOCTYPE html>
<!-- الوكيل 5 — هارنس مستقل: SUI-025 carousel موسّط بعد الكشف/تغير عرض
     سيناريو مختلف: عارض داخل تفاصيل مقلوبة (accordion closed ثم مفتوح)،
     وتغير عرض الأب بلا window-resize، وinit مزدوج (عداد ResizeObserver
     ملفوف قبل تحميل السكربت عبر سكربت مسبق). -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A5 — carousel عند الكشف</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../../shared/tokens.css">
  <link rel="stylesheet" href="../../../../../components/carousel/carousel.css">
  <script>
    /* عدّاد مراقبي ResizeObserver لكل عنصر يُرصد — للفحص المستقل فقط */
    window.__roWatch = [];
    (function () {
      var NativeRO = window.ResizeObserver;
      window.ResizeObserver = function (cb) {
        var ro = new NativeRO(cb);
        var self = this;
        this.observe = function (el) {
          window.__roWatch.push({ tag: el.getAttribute('data-viewport') != null ? 'viewport' : (el.className || el.tagName) });
          ro.observe(el);
        };
        this.unobserve = function (el) { ro.unobserve(el); };
        this.disconnect = function () { ro.disconnect(); };
      };
    })();
  </script>
  <script src="../../../../../components/carousel/carousel.js"></script>
  <style>
    body{font-family:var(--micro-font-family);margin:12px;background:var(--micro-surface-page)}
    .host{width:320px;border:1px dashed #B9C6C2;padding:8px}
    .m-carousel__card{background:var(--micro-surface-base);border:1px solid #D9E1DE;border-radius:16px;padding:16px;min-height:120px}
  </style>
</head>
<body>
  <button id="reveal-btn" type="button">كشف</button>
  <button id="widen-btn" type="button">عرض الأب 360</button>
  <section class="folded" id="car-section" style="display:none">
    <div class="host" id="car-host">
      <div class="m-carousel" data-carousel data-carousel-label="هارنس" aria-label="هارنس">
        <div class="m-carousel__viewport" data-viewport>
          <ul class="m-carousel__track" data-track>
            <li class="m-carousel__slide" data-carousel-slide data-card-label="بطاقة أ"><div class="m-carousel__card"><strong>بطاقة أ</strong><p>أول بطاقة في هارنس الوكيل 5.</p></div></li>
            <li class="m-carousel__slide" data-carousel-slide data-card-label="بطاقة ب"><div class="m-carousel__card"><strong>بطاقة ب</strong><p>ثانية.</p></div></li>
            <li class="m-carousel__slide" data-carousel-slide data-card-label="بطاقة ج"><div class="m-carousel__card"><strong>بطاقة ج</strong><p>ثالثة.</p></div></li>
          </ul>
        </div>
        <button class="m-carousel__arrow" type="button" data-carousel-prev aria-label="السابق">‹</button>
        <button class="m-carousel__arrow" type="button" data-carousel-next aria-label="التالي">›</button>
        <span class="m-carousel__dots" data-carousel-dots aria-label="موضع البطاقة"></span>
      </div>
    </div>
  </section>
</body>
</html>
