<!DOCTYPE html>
<!-- الوكيل 5 — هارنس مستقل: SUI-011 فجوة أهداف لمس المقاطع الملتفة
     تركيب مختلف عن وكيل 2: حاوية أضيق (240px) داخل مقطع حقل، عناصر أكثر
     (6 مقاطع بأسماء متباينة الأطوال) لالتفاف في صفوف أكثر من اثنين. -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A5 — مقاطع ملتفة</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../../shared/tokens.css">
  <link rel="stylesheet" href="../../../../../components/selection/selection.css">
  <script src="../../../../../components/selection/selection.js"></script>
  <style>
    body{font-family:var(--micro-font-family);margin:12px;background:var(--micro-surface-page)}
    .narrow{width:240px;border:1px dashed #B9C6C2;padding:8px;margin-bottom:16px}
    .wide{width:640px;border:1px dashed #B9C6C2;padding:8px}
  </style>
</head>
<body>
  <div class="narrow" id="seg-narrow">
    <div class="m-seg" role="group" aria-label="فلاتر سريعة" data-seg id="seg-1">
      <button type="button" class="m-seg__item" aria-pressed="true" data-value="a">الكل</button>
      <button type="button" class="m-seg__item" data-value="b">بانتظار العميل</button>
      <button type="button" class="m-seg__item" data-value="c">قيد التنفيذ</button>
      <button type="button" class="m-seg__item" data-value="d">تم التسليم</button>
      <button type="button" class="m-seg__item" data-value="e">مرتجع</button>
      <button type="button" class="m-seg__item" data-value="f" disabled>مؤرشف</button>
    </div>
  </div>
  <div class="wide">
    <div class="m-seg" role="group" aria-label="سطر واحد" data-seg id="seg-2">
      <button type="button" class="m-seg__item" aria-pressed="true" data-value="a">الكل</button>
      <button type="button" class="m-seg__item" data-value="b">بانتظار العميل</button>
      <button type="button" class="m-seg__item" data-value="c">قيد التنفيذ</button>
    </div>
  </div>
</body>
</html>
