<!DOCTYPE html>
<!-- الوكيل 5 — هارنس مستقل: SUI-008 رقم stat طويل يلتف داخل البطاقة
     سيناريوهات أطول من وكيل 4: 16 و20 و25 خانة، داخل بطاقات بعرض 288px
     (عمود 320) ومثال وحدة/مؤشر مع الرقم. -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A5 — stat برقم طويل</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../../shared/tokens.css">
  <link rel="stylesheet" href="../../../../../components/data/data.css">
  <style>
    body{font-family:var(--micro-font-family);margin:12px;background:var(--micro-surface-page)}
    .card{width:288px;background:var(--micro-surface-base);border:1px solid var(--micro-border-card);border-radius:16px;padding:16px;margin-bottom:14px}
  </style>
</head>
<body>
  <div class="card" id="card16">
    <div class="m-stat">
      <span class="m-stat__label">رقم 16 خانة</span>
      <span class="m-stat__value">
        <span class="m-stat__num" id="num16">1234567890123456</span>
        <span class="m-stat__unit">دينار</span>
      </span>
    </div>
  </div>
  <div class="card" id="card20">
    <div class="m-stat">
      <span class="m-stat__label">رقم 20 خانة</span>
      <span class="m-stat__value">
        <span class="m-stat__num" id="num20">12345678901234567890</span>
        <span class="m-stat__unit">دينار</span>
      </span>
    </div>
  </div>
  <div class="card" id="card25">
    <div class="m-stat">
      <span class="m-stat__label">رقم 25 خانة مع مؤشر</span>
      <span class="m-stat__value">
        <span class="m-stat__num" id="num25">1234567890123456789012345</span>
        <span class="m-stat__unit">دينار</span>
        <span class="m-stat__delta m-stat__delta--tone-negative m-stat__delta--down">▼ 3.2%</span>
      </span>
    </div>
  </div>
  <!-- صفر مقابل مجهول: KEEP قواعد البيانات الصادقة -->
  <div class="card" id="card-zero">
    <div class="m-stat">
      <span class="m-stat__label">صفر حقيقي</span>
      <span class="m-stat__value"><span class="m-stat__num">0</span><span class="m-stat__unit">دينار</span></span>
    </div>
  </div>
  <div class="card" id="card-unknown">
    <div class="m-stat">
      <span class="m-stat__label">قيمة مجهولة</span>
      <span class="m-stat__value m-stat__value--unknown"><span class="m-stat__num">—</span><span class="m-stat__unit">غير متاح</span></span>
    </div>
  </div>
</body>
</html>
