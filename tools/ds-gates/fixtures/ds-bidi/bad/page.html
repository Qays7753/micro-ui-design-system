<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
body { font-family: Arial; font-size: 16px; margin: 24px; }
.val { display: inline-block; margin: 8px 0; }
</style></head>
<body>
<!-- The bug itself: numeric runs NOT inside an LTR isolation. In a bare
     RTL paragraph the leading +/− (neutral/ET before EN) takes the
     paragraph direction and lands on the run's far side: «2.250+». -->
<p class="val" data-ds-check="bidi">د.أ +2.250</p>
<p class="val" data-ds-check="bidi">د.أ −35</p>
<p class="val" data-ds-check="bidi">د.أ 1,245.750</p>
</body></html>
