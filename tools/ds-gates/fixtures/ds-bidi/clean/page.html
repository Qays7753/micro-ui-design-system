<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
body { font-family: Arial; font-size: 16px; margin: 24px; }
.val { display: inline-block; margin: 8px 0; }
</style></head>
<body>
<!-- The fix: every numeric run inside <bdi dir="ltr"> — sign adjacent to
     the first digit, fils after the whole, order intact. -->
<p class="val" data-ds-check="bidi">د.أ <bdi dir="ltr">+2.250</bdi></p>
<p class="val" data-ds-check="bidi">د.أ <bdi dir="ltr">−35</bdi></p>
<p class="val" data-ds-check="bidi">د.أ <bdi dir="ltr">1,245.750</bdi></p>
<p class="val" data-ds-check="bidi">من <bdi dir="ltr">10:24</bdi></p>
</body></html>
