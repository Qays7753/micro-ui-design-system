<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face {
  font-family: 'SwapFont';
  src: url('font.woff2') format('woff2');
  font-display: swap;
}
/* metric-matched fallback: size-adjust = Plex total advance / Liberation
   advance for the fixture text, measured with fontTools (104.703%); vertical
   metrics matched via the S1 fonts.css ascent/descent values. */
@font-face {
  font-family: 'MatchedFallback';
  src: local('Liberation Sans');
  size-adjust: 104.703%;
  ascent-override: 80.81%;
  descent-override: 30.909%;
  line-gap-override: 0%;
}
p { font-family: 'SwapFont', 'MatchedFallback', Arial; width: 300px; margin: 0; font-size: 16px; line-height: 24px; }
</style></head>
<body>
<p id="text">111 222 333 444 555 666 777 888 999 000 111 222 333 444 555 666 777 888 999 000 111 222 333 444 555 666 777 888 999 000</p>
<div data-ds-font-ref style="height: 10px; background: #eee;"></div>
<div data-ds-font-ref style="height: 10px; background: #ddd;"></div>
</body></html>
