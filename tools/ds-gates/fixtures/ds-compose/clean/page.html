<!doctype html>
<html dir="rtl"><head><meta charset="utf-8"></head><body>
<div data-ds-check="compose">
  <div class="mds-context-bar"><span>مشروع الحوراني</span></div>
  <div class="mds-page-header">
    <h1 class="mds-page-header-title">اليوم</h1>
    <div class="mds-page-header-end">
      <button class="mds-button mds-button--secondary mds-button--sm">سجّل حركة</button>
    </div>
  </div>
  <div data-ds-check="compose-content" style="display:flex; flex-direction:column; gap:32px;">
    <div class="mds-hero-surface" style="padding:20px;">
      <div><span class="mds-hero-label">المالية</span></div>
      <div><span class="mds-hero-value mds-type-display-hero" style="font-size:40px; line-height:48px; display:inline-block;"><span>1,245</span></span></div>
    </div>
    <section class="mds-section">
      <span class="mds-section-count">3</span>
      <div class="mds-money"><span class="mds-money-visual" style="display:inline-flex; gap:4px;"><bdi class="mds-money-value" dir="ltr" style="font-size:16px; line-height:24px;">1,245.750</bdi><span class="mds-money-unit">د.أ</span></span></div>
    </section>
    <div class="mds-tile-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <div class="mds-tile"><span class="mds-tile-value" style="font-size:16px; line-height:24px;">4</span></div>
      <div class="mds-tile"><span class="mds-tile-value" style="font-size:16px; line-height:24px;">2</span></div>
      <div class="mds-tile"><span class="mds-tile-value" style="font-size:16px; line-height:24px;">7</span></div>
      <div class="mds-tile"><span class="mds-tile-value" style="font-size:16px; line-height:24px;">9</span></div>
    </div>
  <div class="mds-sheet"><input type="text"/></div>
</div>
</body></html>
