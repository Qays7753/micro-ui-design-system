<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"></head><body>
<!-- the same shapes WITH real handlers: each press flips its element
     (class), the input accepts typing -> the gate must PASS this page. -->
<button id="seg" class="seg">المبدّل المقسّم</button>
<button id="chip" class="chip">رقاقة حية</button>
<input id="field" placeholder="اكتب هنا" />
<script>
  document.getElementById('seg').addEventListener('click', function () {
    this.classList.toggle('seg--on');
  });
  document.getElementById('chip').addEventListener('click', function () {
    this.classList.toggle('chip--on');
  });
</script>
</body></html>
