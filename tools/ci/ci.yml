name: CI

on:
  push:
    branches: [feature/integration-readiness-2026-11-21]
  pull_request:
    branches: [feature/integration-readiness-2026-11-21]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so origin/main exists for the static gates' diffs.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync

      - name: Install Playwright Chromium
        run: uv run python -m playwright install --with-deps chromium

      - name: Set git identity (diff-based gates)
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"

      # The D12 visual baseline lives outside the repository
      # (/home/z/my-project/visual-baseline), so the visual regression gate
      # is local-only and skipped here (see docs/TESTING.md).
      - name: Run all quality gates
        run: uv run python tools/check-all.py --skip-visual
