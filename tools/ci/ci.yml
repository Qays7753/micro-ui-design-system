# سير عمل CI لمستودع Micro UI (الجولة الثانية R7 — جاهز للتركيب).
# التركيب (المالك فقط، مرة واحدة):
#   git mv tools/ci/ci.yml .github/workflows/ci.yml && git commit && git push
# يتطلب توكن رفع بنطاق workflow (انظر tools/ci/README.md).
name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # البصمة البصرية والمقارنة مع origin/main
          fetch-tags: true   # المرجع v0.1.0 للبوابة البصرية
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - name: كل البوابات (بلا --skip-visual)
        run: uv run python tools/check-all.py
      - name: فحص الأنواع
        run: npm run typecheck
      - name: رفع مخرجات الفحص عند الفشل
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-outputs
          path: |
            /tmp/micro-check-all-*
            /tmp/micro-*
          if-no-files-found: ignore
