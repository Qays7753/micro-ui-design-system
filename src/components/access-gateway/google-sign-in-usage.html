<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تسجيل الدخول عبر Google — Micro</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="auth-screens.css">
</head>
<body class="m-auth-page">
  <main class="m-auth-screen m-auth-screen--signin" aria-labelledby="signin-title">
    <div class="m-auth-screen__ornaments" aria-hidden="true"></div>
    <header class="m-auth-screen__brand-zone">
      <img class="m-auth-screen__logo" src="../../assets/brand/micro-logo/v2/variants/full-color/micro-lockup-arabic.svg" width="128" height="40" alt="Micro">
    </header>
    <section class="m-auth-screen__panel" aria-labelledby="signin-title">
      <div class="m-auth-screen__copy">
        <h1 class="m-auth-screen__title" id="signin-title">أهلًا بك</h1>
        <p class="m-auth-screen__description">إدارة أعمالك من مكان واحد.</p>
      </div>
      <div class="m-auth-screen__actions">
        <div class="m-auth-screen__provider-region" role="group" aria-label="تسجيل الدخول عبر Google">
          <div class="m-auth-screen__provider-slot" data-google-provider-slot>
            <span class="m-auth-screen__provider-placeholder" data-preview-placeholder>مكان زر Google الرسمي</span>
          </div>
        </div>
        <p class="m-auth-screen__status" data-access-status role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <!-- المضيف وحده يحمّل Google Identity Services ويرسم الزر الرسمي في الموضع أعلاه.
       حالات الشاشة يقودها المضيف: يضبط data-auth-state ويكتب نص الحالة. السكربت
       أدناه محاكاة مضيف للعرض فقط؛ لا توجد أي حالة أو منطق داخل المكتبة. -->
  <script>
    (() => {
      const messages = {
        'loading': 'جارٍ التحقق من حسابك\u2026',
        'error-network': 'تعذّر الاتصال بالخدمة. تحقّق من اتصالك ثم حاول مجددًا.',
        'error-cancelled': 'أُلغيت عملية تسجيل الدخول.',
        'error-auth': 'تعذّر التحقق من هويتك. حاول مجددًا.',
      };
      const state = new URLSearchParams(location.search).get('state');
      if (state && messages[state]) {
        document.querySelector('.m-auth-screen').dataset.authState = state;
        document.querySelector('[data-access-status]').textContent = messages[state];
      }
    })();
  </script>
</body>
</html>
